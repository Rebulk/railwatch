name: Release

on:
  push:
    tags: ["v*"]
  # Trusted publishers are registered per workflow FILE, so the only place a
  # check can prove this one is trusted is inside this one. Run it from the
  # Actions tab (or `gh workflow run release.yml`) to answer "would a tag
  # publish?" without cutting a release.
  workflow_dispatch:

jobs:
  # Proves the OIDC exchange this workflow relies on, and publishes nothing.
  # Fails with the same "No trusted publisher configured for this workflow"
  # a release would, at a moment when that costs nothing.
  verify_trusted_publishing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Exchange the GitHub OIDC token for a RubyGems one
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # The exchange above IS the check: it is the same call release-gem makes,
      # and RubyGems answers a workflow it does not trust with "No trusted
      # publisher configured for this workflow". Nothing further can be asked
      # of the token here -- it is scoped to pushing this one gem, so any read
      # (profile/me included) comes back 401 even when publishing would work.
      - name: Report
        run: |
          if [ -z "${GEM_HOST_API_KEY:-}" ]; then
            echo "The exchange reported success but produced no token."
            exit 1
          fi
          echo "RubyGems trusted this workflow and issued a push token."
          echo "A v* tag will publish without a stored API key."

  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # public/railwatch is a build artifact, so a fresh checkout has no
      # manifest and the embedded dashboard specs fail on it. ci.yml learned
      # this; this workflow had the same gap, which is what turned the
      # v0.2.0.pre1 tag red before it ever reached the publish step.
      - name: Build the dashboard bundle
        run: bundle exec rake dashboard:build

      - name: Run specs
        run: bundle exec rspec

      # The script, not `rake package:verify`: that task depends on
      # dashboard:build, which would repeat the pnpm install and vite build
      # just done above. The CI package job still uses the rake task, where
      # nothing has built the bundle yet.
      - name: Verify package
        run: bundle exec ruby script/verify_package

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # bundler-cache installs the bundle. Without it `bundle exec` below
      # raises before it reaches rake, which is how the publish job fails
      # even when everything else is right.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # The gem ships the compiled dashboard, so it has to exist before
      # `gem build` reads the file list.
      - name: Build dashboard bundle
        run: bundle exec rake dashboard:build

      - name: Refuse to publish a gem with no dashboard in it
        run: bundle exec rake package:assert_dashboard

      - name: Build gem
        id: build
        run: |
          gem build railwatch.gemspec --strict
          echo "gem=railwatch-$(ruby -Ilib -rrailwatch/version -e 'print Railwatch::VERSION').gem" >> "$GITHUB_OUTPUT"

      # A tag re-pushed, or a version already published by hand, is not a
      # failure: the thing the tag asked for is already true. Skip rather
      # than fail, so a red run always means something is actually wrong.
      # Asks for the one version, rather than grepping the list of all of
      # them: "0.2.0" is a substring of "0.2.0.pre1", so a substring match
      # would skip the 0.2.0 release as already done and say nothing.
      - name: Is this version already on RubyGems?
        id: published
        run: |
          version="$(ruby -Ilib -rrailwatch/version -e 'print Railwatch::VERSION')"
          url="https://rubygems.org/api/v2/rubygems/railwatch/versions/${version}.json"
          code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
          case "$code" in
            200) echo "Version $version is already published; nothing to push."
                 echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "Version $version is not published yet."
                 echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "RubyGems answered $code for $url; publishing rather than guessing."
                 echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # rubygems/release-gem runs `bundle exec rake release`, which needs a
      # `release` task (bundler/gem_tasks) this Rakefile does not define, and
      # which rebuilds the gem from the gemspec -- so what it pushes is not
      # the file the dashboard assertion above just inspected. Exchanging the
      # credential and pushing the verified artifact keeps that gate binding.
      #
      # The cost is release-gem's build attestation, which this does not
      # produce. Worth revisiting if `gem push` gains it natively.
      - name: Authenticate to RubyGems with Trusted Publishing
        if: steps.published.outputs.skip != 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push the gem that was just verified
        if: steps.published.outputs.skip != 'true'
        run: gem push "${{ steps.build.outputs.gem }}"

      # RubyGems indexes asynchronously, so a release is not done when the
      # push returns. Watch the compact index rather than the API: the API
      # reported 0.2.2 published while index.rubygems.org still ended at
      # 0.2.1, and a `bundle add railwatch` in that window resolved to the
      # older version. The compact index is the file Bundler reads, so it is
      # the one that decides whether anybody can actually install this.
      - name: Wait for Bundler to be able to resolve it
        if: steps.published.outputs.skip != 'true'
        run: |
          version="$(ruby -Ilib -rrailwatch/version -e 'print Railwatch::VERSION')"
          for _ in $(seq 1 60); do
            if curl -s https://index.rubygems.org/info/railwatch | grep -q "^${version} "; then
              echo "railwatch $version is in the compact index; bundle add resolves to it."
              exit 0
            fi
            sleep 10
          done
          echo "railwatch $version was pushed but has not reached the compact index in ten minutes."
          echo "It is published -- check https://rubygems.org/gems/railwatch/versions/$version"
          exit 1
