name: CI

on:
  pull_request:
  push:
    branches: [main]

# Jobs get no write access unless they explicitly request it (OIDC publishing).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # public/railwatch is a build artifact, not a checked-in one, and the
      # embedded dashboard specs serve the real bundle: its HTML shell, its
      # hashed assets, and the Inertia version taken from its manifest. Build
      # it here rather than teaching those specs to skip, which would leave
      # the dashboard untested exactly where it is most likely to break.
      - name: Build the dashboard bundle
        run: bundle exec rake dashboard:build

      - name: Audit Ruby dependencies
        run: bundle exec bundler-audit check --update

      - name: Run specs
        run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit JavaScript dependencies
        run: pnpm audit

      - name: Typecheck, lint, format, test
        run: pnpm check && pnpm lint && pnpm format && pnpm test

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Verify public package (builds the dashboard bundle first)
        run: bundle exec rake package:verify

  # The per-request overhead budget (bench/overhead.rb) and the no-DB-writes
  # guarantee (bench/no_db_writes.rb). Runner load varies, so this job is
  # advisory: it fails loudly but does not block merges.
  overhead:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Overhead gate
        run: bundle exec rake bench
