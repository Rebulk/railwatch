name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "3.5"]
        rails: [rails_7_2, rails_8_0, rails_8_1]
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.rails }}.gemfile
      # ruby/setup-ruby currently resolves 3.5 to a preview build. Native gem
      # packages do not carry that preview ABI, so compile them for Ruby.
      BUNDLE_FORCE_RUBY_PLATFORM: ${{ matrix.ruby == '3.5' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop

  # The per-request overhead budget (bench/overhead.rb) and the no-DB-writes
  # guarantee (bench/no_db_writes.rb). Runner load varies, so this job is
  # advisory: it fails loudly but does not block merges.
  overhead:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Overhead gate
        run: bundle exec rake bench
