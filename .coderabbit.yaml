# CodeRabbit review configuration.
#
# What is excluded and why: pkg/ is a built gem, and lockfiles are resolver
# output.
reviews:
  path_filters:
    - "!pkg/**"
    - "!**/*.lock"
    - "!pnpm-lock.yaml"
    - "!Gemfile.lock"
  # Say which files were skipped, so an excluded path is a visible choice
  # rather than a silent hole in the review.
  review_details: true
