default: &default
  adapter: sqlite3
  pool: 5
  timeout: 5000
test:
  primary:
    <<: *default
    database: storage/test<%= ENV['TEST_ENV_NUMBER'] %>.sqlite3
  queue:
    <<: *default
    database: storage/test_queue<%= ENV['TEST_ENV_NUMBER'] %>.sqlite3
development:
  <<: *default
  database: storage/development.sqlite3
